[package]
name = "hyprland-tray-minimizer"
version = "0.1.0"
edition = "2021"

[dependencies]
# zbus is a modern, async D-Bus library
zbus = "3"

# tokio is the asynchronous runtime
tokio = { version = "1", features = ["full"] }

# For parsing JSON output from hyprctl
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For handling errors gracefully
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3" # needed for the .next() method on streams
